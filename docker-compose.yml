services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata_learn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata_learn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://strata:strata@postgres:5432/strata_learn
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq app.worker.tasks.WorkerSettings
    volumes:
      - ./backend/app:/app/app
      # Phase 2: prompt templates live at the repo root (docs/prompts/), not
      # inside backend/ — the Dockerfile only ever copies backend/ into the
      # image, so this needs its own mount. Read-only: the worker never writes here.
      - ./docs:/app/docs:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://strata:strata@postgres:5432/strata_learn
      REDIS_URL: redis://redis:6379/0
      PROMPTS_DIR: /app/docs/prompts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
