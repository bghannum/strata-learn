[project]
name = "strata-learn-backend"
version = "0.1.0"
description = "Strata Learn — repo study guide & quiz generator (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "greenlet>=3.1",  # required by SQLAlchemy's async ORM session, not pulled in automatically
    "arq>=0.26",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "gitpython>=3.1",
    # Pinned to the same ABI-14 grammar generation as tree-sitter-typescript,
    # whose latest release (0.23.2) has never shipped an ABI-15 build. Newer
    # tree-sitter core + newer tree-sitter-python/-javascript (ABI 15) alongside
    # this ABI-14 typescript grammar segfaults (external-scanner ABI mismatch) —
    # reproduced and diagnosed in Phase 1. Bump all four together, only once
    # tree-sitter-typescript ships an ABI-15 release.
    "tree-sitter==0.23.2",
    "tree-sitter-python==0.23.6",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-typescript==0.23.2",
    # >=0.40 was never actually enough: AnthropicProvider (Phase 2) calls
    # client.messages.parse()/reads response.parsed_output, which the SDK
    # only introduced in 0.77.0 ("add support for Structured Outputs in the
    # Messages API") — an environment satisfying only the old floor gets an
    # AttributeError on the very first Layer B call. Confirmed via the SDK's
    # own CHANGELOG.md and source history: absent at v0.76.0, present at
    # v0.77.0. Found via Codex's Phase 2 pre-push review.
    "anthropic>=0.77",
    "openai>=1.57",
    "bcrypt>=4.2",
    "email-validator>=2.2",  # enables pydantic's EmailStr, used by auth registration/login
    "python-multipart>=0.0.17",
    "pathspec>=0.12",
    "rapidfuzz>=3.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# Phase 8's self-hosted audio backends (ADR-010). Opt-in — CI installs
# `.[dev]` only, so none of this ever enters the test image, and the api
# image only carries it when built with INSTALL_VOICE=true. Both runtimes
# are torch-free (CTranslate2, onnxruntime) and faster-whisper decodes
# through PyAV's bundled FFmpeg, so no system packages are needed either.
voice = [
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
    # Espeak-free G2P for Kokoro (NeuML/kokoro-base-onnx, Apache-2.0). Not
    # `kokoro-onnx`: that phonemizes through espeak-ng (GPL) and its macOS
    # wheel exits the process on first use — see local_backend.py.
    "ttstokenizer>=1.0",
    "huggingface_hub>=0.25",
    "numpy>=1.26",
]
# The word-error-rate evaluation harness (scripts/voice-eval). Kept out of
# `dev` on purpose: it's a paid, deliberate script, not part of the suite.
eval = [
    "jiwer>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires calling Depends()/Form()/File()
# etc. directly in argument defaults — that's how FastAPI recognizes them, not a
# mutable-default-argument bug (B008's usual target).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query", "fastapi.Body"]
